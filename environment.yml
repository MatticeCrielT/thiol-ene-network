# Conda environment that runs this project on Linux / WSL (CPU only).
# Create:   conda env create -f environment.yml
# Use:      conda activate thiolene
# Versions are the ones tested on 2026-10-12/13 (simulation + analysis).
name: thiolene
channels:
  - conda-forge
dependencies:
  - python=3.10
  - hoomd=4.0.1
  - gsd=2.9
  - freud=3.4
  - signac=2.4
  - signac-flow=0.29
  - networkx=3.4
  - numpy=1.26
  - scipy=1.15
  - matplotlib=3.10
  - pandas=2.3
  - openpyxl=3.1
